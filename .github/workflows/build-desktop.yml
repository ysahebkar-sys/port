name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build application
        run: |
          pyinstaller --clean --noconfirm desktop.spec

      - name: Package
        run: |
          Compress-Archive -Path dist\ConfigPortTester.exe -DestinationPath ConfigPortTester-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfigPortTester-Windows
          path: ConfigPortTester-Windows.zip

  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build application
        run: |
          pyinstaller --clean --noconfirm desktop.spec

      - name: Package
        run: |
          mkdir -p ConfigPortTester.app
          cp -R dist/ConfigPortTester ConfigPortTester.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfigPortTester-macOS
          path: ConfigPortTester.app
